[package]
name = "wordcraft-wasm"
description = "WordCraft's headless converter for JavaScript (browser pages and workers): bytes in, PDF or another format out"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "wordcraft-wasm"
path = "src/main.rs"

[dependencies]
wordcraft-engine = { workspace = true }
wordcraft-fonts = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
